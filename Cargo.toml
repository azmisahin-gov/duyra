[package]
name = "duyra"
version = "0.1.8"
edition = "2024"
description = "DUYRA — Bilirkişi çalışma asistanı"
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
self_update = { version = "1.3.3", default-features = false, features = ["reqwest", "rustls", "github", "signatures", "checksums", "archive-zip", "compression-zip-deflate"] }

[build-dependencies]
winresource = "=0.1.34"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
