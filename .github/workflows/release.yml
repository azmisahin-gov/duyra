name: DUYRA Sürüm Yayını

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Windows x64 sürümünü oluştur
    runs-on: windows-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Sürüm numarasını kontrol et
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionMatch) { throw "Cargo.toml içinde paket sürümü bulunamadı." }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            "release_needed=false" >> $env:GITHUB_OUTPUT
            Write-Host "$tag zaten yayımlanmış. Yeni sürüm oluşturulmayacak."
          } else {
            "release_needed=true" >> $env:GITHUB_OUTPUT
            Write-Host "$tag henüz yok. Yeni sürüm hazırlanacak."
            $global:LASTEXITCODE = 0
          }

      - name: Rust araçlarını kur
        if: steps.version.outputs.release_needed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust bağımlılık önbelleğini yükle
        if: steps.version.outputs.release_needed == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Biçimi denetle
        if: steps.version.outputs.release_needed == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy denetimini çalıştır
        if: steps.version.outputs.release_needed == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Testleri çalıştır
        if: steps.version.outputs.release_needed == 'true'
        run: cargo test

      - name: Windows uygulamasını derle
        if: steps.version.outputs.release_needed == 'true'
        run: cargo build --release

      - name: İndirme paketlerini hazırla
        if: steps.version.outputs.release_needed == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/duyra.exe dist/duyra-windows-x86_64.exe
          Compress-Archive -Path dist/duyra-windows-x86_64.exe -DestinationPath dist/duyra-windows-x86_64.zip -Force
          $hash = (Get-FileHash dist/duyra-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  duyra-windows-x86_64.exe" | Set-Content dist/SHA256SUMS.txt

      - name: DUYRA sürümünü GitHub Releases sayfasında yayımla
        if: steps.version.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/duyra-windows-x86_64.exe dist/duyra-windows-x86_64.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "DUYRA ${{ steps.version.outputs.tag }}" --notes "DUYRA'nın ${{ steps.version.outputs.tag }} sürümü. Windows x64 için doğrudan çalıştırılabilir uygulama ve ZIP paketi ektedir. Uygulamayı indirin ve çalıştırın."
