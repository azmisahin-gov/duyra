name: DUYRA Görsel CI Denemesi

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/ci-ekran-goruntusu.sh"
      - "scripts/ci-inceleme-akisi.sh"
      - ".github/workflows/gorsel-denetim.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/ci-ekran-goruntusu.sh"
      - "scripts/ci-inceleme-akisi.sh"
      - ".github/workflows/gorsel-denetim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux yazılım OpenGL ana ekran görüntüsü
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Rust araçlarını kur
        uses: dtolnay/rust-toolchain@stable

      - name: Linux grafik ve pencere bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb xauth xdotool imagemagick mesa-utils \
            pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinerama0-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri

      - name: Rust bağımlılık önbelleğini yükle
        uses: Swatinem/rust-cache@v2

      - name: Linux uygulamasını derle
        run: cargo build --release --features eframe/x11

      - name: Yazılım OpenGL ile DUYRA penceresini aç ve görüntüsünü al
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24 -nolisten tcp" \
            bash scripts/ci-ekran-goruntusu.sh

      - name: Sahte verili inceleme akışını tıklayarak doğrula
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24 -nolisten tcp" \
            bash scripts/ci-inceleme-akisi.sh

      - name: Görsel deneme çıktısını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duyra-gorsel-denetim-linux-${{ github.sha }}
          path: artifacts/gorsel-denetim/
          if-no-files-found: error
          retention-days: 7
