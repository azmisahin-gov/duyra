name: Kod Denetimi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  denetim:
    name: Windows x64 denetimi
    runs-on: windows-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Rust stable araçlarını kur
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust bağımlılık önbelleğini yükle
        uses: Swatinem/rust-cache@v2

      - name: Kod biçimini denetle
        run: cargo fmt --all -- --check

      - name: Clippy denetimini çalıştır
        run: cargo clippy --all-targets -- -D warnings

      - name: Testleri çalıştır
        run: cargo test
